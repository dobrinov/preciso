# Copies the app's secrets from GitHub (Settings → Secrets and variables →
# Actions) to Fly.io, so GitHub is the single place they are kept.
#
# After rotating a key (myPOS configuration pack, Brevo SMTP key, admin
# password or login path, …):
#   1. update the secret in GitHub (or: gh secret set NAME)
#   2. Actions → "Sync secrets to Fly" → Run workflow
# Fly restarts the app with the new values (about a minute).
name: Sync secrets to Fly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Push secrets to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MYPOS_CONFIG_PACKAGE: ${{ secrets.MYPOS_CONFIG_PACKAGE }}
          SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_LOGIN_PATH: ${{ secrets.ADMIN_LOGIN_PATH }}
        run: |
          set -euo pipefail
          # Values go in on stdin (never on the command line); empty ones are skipped.
          {
            for name in MYPOS_CONFIG_PACKAGE SMTP_ADDRESS SMTP_USERNAME SMTP_PASSWORD ADMIN_PASSWORD ADMIN_LOGIN_PATH; do
              value="${!name}"
              if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value"; else echo "skipping empty $name" >&2; fi
            done
          } | flyctl secrets import -a preciso
          flyctl secrets list -a preciso
